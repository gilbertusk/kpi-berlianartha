; Shared PHP settings for every target (development, production).
expose_php = Off
memory_limit = 256M
max_execution_time = 60
; Upload limits stay conservative until evidence upload rules are decided (Step 08).
upload_max_filesize = 10M
post_max_size = 12M
; Runtime timezone stays UTC (ADR-0007); business timezone is APP_TIMEZONE.
date.timezone = UTC
session.cookie_httponly = 1
session.use_strict_mode = 1
