; Overrides for the [www] pool defined by the official image.
[global]
error_log = /proc/self/fd/2
log_limit = 8192

[www]
; Liveness endpoint used by fpm-healthcheck (FastCGI, not exposed through nginx).
ping.path = /fpm-ping
ping.response = pong
; Expose request/worker errors to the container log.
catch_workers_output = yes
decorate_workers_output = no
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500
