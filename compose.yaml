# Docker Compose — local development environment (Step 03).
#
# First run on a clean checkout:  bash scripts/dev.sh bootstrap
# Afterwards:                     docker compose up -d --wait
#
# Secrets (DB_PASSWORD, AWS_*) are read from the git-ignored .env generated by
# the bootstrap script. PostgreSQL and Redis are NOT published to the host.
# Published ports bind to 127.0.0.1 only.

name: kpi-berlianartha

x-app: &app
  image: kpi-berlianartha-app:dev
  build:
    context: .
    target: development
    args:
      UID: ${DOCKER_UID:-1000}
      GID: ${DOCKER_GID:-1000}
  volumes:
    - .:/var/www/html
    # Linux-side named volumes avoid slow bind-mount I/O (notably Docker Desktop
    # on Windows) for the largest/most frequently read paths.
    - vendor:/var/www/html/vendor
    - view-cache:/var/cache/laravel-views
  environment: &app-environment
    VIEW_COMPILED_PATH: /var/cache/laravel-views
    APP_URL: http://localhost:${APP_PORT:-8088}
    DB_HOST: postgres
    DB_PORT: "5432"
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_CLIENT: phpredis
    AWS_ENDPOINT: http://seaweedfs:8333
    AWS_USE_PATH_STYLE_ENDPOINT: "true"
    AWS_BUCKET: ${AWS_BUCKET:-kpi-local}
    MAIL_MAILER: smtp
    MAIL_HOST: mailpit
    MAIL_PORT: "1025"
  restart: unless-stopped

services:
  app:
    <<: *app
    environment:
      <<: *app-environment
      KPI_AUTO_INSTALL: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "fpm-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 300s

  worker:
    <<: *app
    command: ["php", "artisan", "queue:work", "redis", "--queue=default", "--sleep=3", "--tries=3", "--backoff=10", "--max-time=3600"]
    stop_grace_period: 30s
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "artisan", "ops:heartbeat", "worker", "--check", "--max-age=120"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "artisan", "ops:heartbeat", "scheduler", "--check", "--max-age=150"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 90s

  # One-shot: builds Vite assets into public/build when missing. Only the files
  # the build needs are mounted (read-only except public/), it runs as the
  # developer UID, and node_modules lives in tmpfs so Linux binaries never
  # overwrite the host copy.
  assets:
    image: node:26.11.1-trixie-slim
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    working_dir: /app
    environment:
      npm_config_cache: /tmp/npm-cache
    volumes:
      - ./package.json:/app/package.json:ro
      - ./package-lock.json:/app/package-lock.json:ro
      - ./.npmrc:/app/.npmrc:ro
      - ./vite.config.js:/app/vite.config.js:ro
      - ./resources:/app/resources:ro
      - ./public:/app/public
      - vendor:/app/vendor:ro
    tmpfs:
      - /app/node_modules:exec,mode=1777
      - /tmp:exec,mode=1777
    command: ["sh", "-c", "[ -f public/build/manifest.json ] || (npm ci --no-audit --no-fund && npm run build)"]
    depends_on:
      app:
        condition: service_healthy
    restart: "no"

  nginx:
    image: nginx:1.31.0-alpine
    ports:
      - "127.0.0.1:${APP_PORT:-8088}:80"
    environment:
      PHP_FPM_UPSTREAM: app:9000
    volumes:
      - ./docker/nginx/templates:/etc/nginx/templates:ro
      - ./public:/var/www/html/public:ro
    depends_on:
      app:
        condition: service_healthy
      assets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-kpi_berlianartha}
      POSTGRES_USER: ${DB_USERNAME:-kpi_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi di .env (jalankan bash scripts/dev.sh bootstrap)}
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8.10.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    entrypoint: ["sh", "/kpi/entrypoint.sh"]
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID wajib diisi di .env (jalankan bash scripts/dev.sh bootstrap)}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY wajib diisi di .env}
      AWS_BUCKET: ${AWS_BUCKET:-kpi-local}
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    volumes:
      - seaweedfs-data:/data
      - ./docker/seaweedfs/entrypoint.sh:/kpi/entrypoint.sh:ro
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  seaweedfs-data:
  vendor:
  view-cache:
